<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sheet</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f7f7f8" />
    <!-- Self-hosted, and byte-identical to what the web app loads. -->
    <link rel="stylesheet" href="/vendor/fonts.css" />
    <style>
      /* Boot splash: shown while the bundle parses and React mounts, so the
         window never sits blank. Pure CSS — no JS dependency. React removes
         `#boot-splash` once it has painted (see `routes/__root.tsx`). */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        color: #0b0b0c;
        z-index: 50;
      }
      html.dark #boot-splash {
        background: #0f0f10;
        color: #ededed;
      }
      .boot-matrix {
        display: grid;
        grid-template-columns: repeat(3, 8px);
        gap: 6px;
      }
      .boot-matrix i {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.18;
        animation: boot-dot-glow 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .boot-matrix i:nth-child(2) { animation-delay: 0.12s; }
      .boot-matrix i:nth-child(3) { animation-delay: 0.24s; }
      .boot-matrix i:nth-child(4) { animation-delay: 0.12s; }
      .boot-matrix i:nth-child(5) { animation-delay: 0.24s; }
      .boot-matrix i:nth-child(6) { animation-delay: 0.36s; }
      .boot-matrix i:nth-child(7) { animation-delay: 0.24s; }
      .boot-matrix i:nth-child(8) { animation-delay: 0.36s; }
      .boot-matrix i:nth-child(9) { animation-delay: 0.48s; }
      @keyframes boot-dot-glow {
        0%, 100% { opacity: 0.18; }
        30% { opacity: 1; }
        60% { opacity: 0.18; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-matrix i {
          animation: none;
          opacity: 0.35;
        }
      }
    </style>
    <script>
      // Dark before first paint, so the window never flashes white on the way
      // in. The full restore — custom themes, interface scale — happens in
      // `@sheet/shell/lib/theme` once React is running; this is only the part
      // that has to be done before there is anything to see.
      try {
        var stored = localStorage.getItem('sheet:theme')
        document.documentElement.classList.toggle(
          'dark',
          stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading">
      <div class="boot-matrix" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
